name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev,notebook,full-history]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Demo pipeline
        run: python -m aml_monitoring.cli --demo
      - name: Validate walkthrough notebook
        run: |
          python - <<'PY'
          import nbformat
          nbformat.validate(nbformat.read('notebooks/aml_pipeline_walkthrough.ipynb', as_version=4))
          PY
