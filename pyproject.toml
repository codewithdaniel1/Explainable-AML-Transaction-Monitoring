[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "explainable-aml-monitoring"
version = "0.1.0"
description = "Reproducible research pipeline for synthetic AML transaction monitoring"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "xgboost>=2,<4",
  "interpret-core>=0.6,<1",
]

[project.optional-dependencies]
explain = ["shap>=0.45,<1", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10"]
notebook = ["ipykernel>=6,<8", "nbclient>=0.10,<1", "nbformat>=5,<6"]

[project.scripts]
aml = "aml_monitoring.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
